<meta charset="utf-8">
<title>Azras Welt</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#8e5bd6">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f3ecfa; --card:#ffffff; --ink:#3a2f4a; --muted:#7a6e8a; --accent:#9b7fd1; --accent-ink:#ffffff; --shadow:0 6px 18px rgba(58,47,74,.14); --r:22px;
  --font-ui:"Fredoka",system-ui,sans-serif; --font-read:"Andika","Fredoka",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark; --bg:#231d2e; --card:#2f2740; --ink:#f2ecfa; --muted:#b5a9c6; --accent:#b49be0; --accent-ink:#231d2e; } }
:root[data-theme="dark"]{ color-scheme:dark; --bg:#231d2e; --card:#2f2740; --ink:#f2ecfa; --muted:#b5a9c6; --accent:#b49be0; --accent-ink:#231d2e; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{position:fixed;inset:0;display:grid;place-items:center;padding:16px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:32px 40px;text-align:center}
h1{margin:0 0 24px;font-weight:600;font-size:44px}
button{font:inherit;font-size:24px;border:0;border-radius:16px;padding:14px 32px;background:var(--accent);color:var(--accent-ink);cursor:pointer;min-height:56px}
button:disabled{opacity:.5;cursor:default}
#note{position:fixed;z-index:10;left:16px;right:16px;bottom:16px;margin:0;text-align:center;font-family:var(--font-read);font-size:20px;color:var(--muted)}
/* Welt */
#world{position:fixed;inset:0;overflow-y:auto;background:linear-gradient(#e3f4ff,#f6efff);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#world>svg{width:100%;height:100%;display:block}
.ui{font-family:var(--font-ui)} .lesen{font-family:var(--font-read)}
.hot{cursor:pointer}
.bub{display:inline-block;font-family:var(--font-read);font-size:29px;line-height:1.28;padding:14px 22px;max-width:100%;box-sizing:border-box;color:#3b2b52;background:#fff;border-radius:30px;box-shadow:0 10px 28px rgba(70,50,140,.18)}
.bub .who{display:block;font-family:var(--font-ui);font-size:19px;opacity:.65;margin-bottom:2px}
.ping{animation:ping 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.schlaf{animation:schlaf 2.4s ease-in-out infinite}
@keyframes schlaf{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes ping{50%{transform:translateY(-8px)}}
/* Katzenwahl */
.pick{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:18px;padding:16px;color:#3b2b52}
.pickcat{width:min(320px,60vw);height:auto}
.pick h1{margin:0;font-weight:600;font-size:44px}
.farben{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
.farbe{width:72px;height:72px;min-height:72px;padding:0;border-radius:50%;border:4px solid #fff;box-shadow:0 4px 12px rgba(70,50,140,.2)}
.farbe.on{border-color:#8e5bd6;box-shadow:0 0 0 4px #8e5bd6}
.name{display:flex;flex-direction:column;align-items:center;gap:8px;font-family:var(--font-read);font-size:28px}
.name input{user-select:text;-webkit-user-select:text;font:inherit;font-size:32px;text-align:center;width:min(360px,80vw);min-height:60px;border:3px solid #c9b6ea;border-radius:16px;padding:6px 12px;color:#3b2b52;background:#fff}
.fertig{background:#8e5bd6;color:#fff}
.katzebub{margin:0}
/* Eltern-Bereich (Englisch): Zahnrad oben links über der Knopfleiste (dort liegt nichts zum Tippen), lange drücken */
#gear{position:fixed;z-index:11;left:16px;top:16px;width:56px;height:56px;min-height:56px;padding:0;border-radius:50%;font-size:28px;line-height:56px;background:transparent;color:var(--muted);opacity:.35;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
section#eltern{position:fixed;z-index:20;inset:0;overflow-y:auto;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,sans-serif}
section#eltern .ewrap{max-width:960px;margin:0 auto;padding:16px}
section#eltern header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
section#eltern h1{margin:0;font-size:28px} section#eltern h2{margin:28px 0 8px;font-size:20px}
section#eltern .eb{font:inherit;font-size:16px;min-height:44px;padding:8px 16px;border-radius:10px}
section#eltern .eb:disabled{opacity:.5}
section#eltern .erow{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
section#eltern label{display:flex;flex-direction:column;gap:4px}
section#eltern select{font:inherit;min-height:44px;padding:4px 8px;border-radius:8px}
section#eltern table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden}
section#eltern th,section#eltern td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid rgba(120,100,150,.18)}
section#eltern summary{cursor:pointer;font-weight:600;margin:10px 0}
section#eltern .muted{color:var(--muted)} section#eltern .ok{color:#2f7d4f;font-weight:600}
/* Arbeitskarte einer Zeit (spiel.js): rechts neben dem Diorama, oben der Nachbar, unten die Katze; hochkant unten */
#werk{position:fixed;z-index:5;top:16px;right:16px;bottom:16px;left:38%;display:flex}
#werk .wk{flex:1;display:flex;flex-direction:column;gap:12px;overflow-y:auto;padding:16px;border-radius:var(--r);background:rgba(255,255,255,.7);box-shadow:var(--shadow)}
#werk .bub{font-size:26px;align-self:stretch;margin:0}
#werk .wk,#buch .wk{position:relative}
#werk .wk:has(.aus:not([hidden])){padding-top:80px}
.wk-knoepfe{position:absolute;top:12px;left:12px;right:12px;z-index:2;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px}
.wk .aus{min-height:52px;padding:8px 20px;border-radius:14px;border:2px solid #c6a4ef;background:#fff;color:#8e5bd6;font-family:var(--font-ui);font-size:20px;cursor:pointer}
#werk .wk-c{background:#f6efff;border:3px solid #c6a4ef;margin-top:auto}
#wkBuehne{display:flex;flex-direction:column}
#werk .zeigen{padding:24px;display:flex;flex-direction:column;gap:12px}
#werk .satz,#werk .merk{font-family:var(--font-read);font-size:32px;line-height:1.35;margin:0;color:#3b2b52}
#werk .merk.zeile{text-align:left;background:#fff6d8;color:#3b2b52;border:2px solid #f2c94c;font-size:26px;min-height:56px}
#werk h2{margin:0;font-weight:600;font-size:32px;color:#3b2b52}
@media (orientation:portrait){ #werk{left:16px;top:42vh} }
/* Bücherregal und Buch (regal.js): ganze Seite über der Welt, Text groß in Andika */
#buch{position:fixed;z-index:6;inset:16px;display:flex}
#buch .wk{flex:1;display:flex;flex-direction:column;gap:12px;overflow-y:auto;padding:16px;border-radius:var(--r);background:#fffaf2;box-shadow:var(--shadow)}
#buch .bub{font-size:26px;align-self:stretch;margin:0 0 0;margin-top:auto}
#buchS{display:flex;flex-direction:column;flex:1}
#buch h2{margin:0 0 12px;font-weight:600;font-size:36px;color:#3b2b52;text-align:center}
/* Regal (Ticket 11): Bücher mit Umschlag stehen auf Holzbrettern */
#buch .wk:has(.regal),#buch .wk:has(.buchoffen){background:linear-gradient(#c79b6d,#b5875a)}
#buch .wk:has(.regal) h2{color:#fff8ec;text-shadow:0 2px 0 rgba(0,0,0,.18)}
#buch .regal{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:36px 26px;padding:8px 8px 0;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 316px,#8a5a3c 316px,#8a5a3c 334px,transparent 334px,transparent 352px)}
#buch .buchkarte{position:relative;display:flex;flex-direction:column;height:316px;padding:0;border:0;border-radius:4px 12px 12px 4px;overflow:hidden;background:#fff;color:#3b2b52;
  box-shadow:inset 10px 0 0 rgba(0,0,0,.14),0 8px 14px rgba(40,20,10,.35);font-family:var(--font-read);font-size:21px;line-height:1.2;cursor:pointer}
#buch .buchkarte .umschlag{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#f4ecdd;overflow:hidden}
#buch .buchkarte .umschlag img,#buch .buchkarte .umschlag svg{width:100%;height:100%;object-fit:cover;display:block}
#buch .buchkarte .emoji{font-size:72px}
#buch .buchkarte .titel{padding:10px 10px 12px 18px;background:#fffaf2;font-weight:600;text-align:center}
#buch .buchkarte .zeichen{position:absolute;top:-4px;right:14px;font-size:40px}
#buch .buchkarte.eigen .umschlag{background:#f6efff}
/* Aufgeschlagenes Buch: links Bild, rechts Text; hochkant eine Seite */
#buch .buchoffen{position:relative;flex:1;display:flex;min-height:0;width:100%;max-width:1760px;margin:0 auto;filter:drop-shadow(0 12px 22px rgba(40,20,10,.35));touch-action:pan-y}
#buch .blatt{flex:1 1 0;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;padding:34px 52px 58px;background:#fffdf7}
#buch .blatt.links{border-radius:16px 3px 3px 16px;background:linear-gradient(to left,#e6dccb 0,#fffdf7 46px)}
#buch .blatt.rechts{border-radius:3px 16px 16px 3px;background:linear-gradient(to right,#e6dccb 0,#fffdf7 46px)}
#buch .blatt.einzeln{border-radius:16px}
#buch .bildflaeche{flex:1 1 0;width:100%;min-height:0;display:flex;align-items:center;justify-content:center}
#buch .bildflaeche.klein{flex:0 0 30%}
#buch .bildflaeche img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;user-select:none}
#buch .bildflaeche svg.szene{width:100%;height:100%;border-radius:10px}
#buch .bildflaeche .emoji{font-size:150px}
#buch .textflaeche{flex:0 0 auto;display:flex;flex-direction:column;gap:10px;width:100%;max-width:820px}
#buch .textflaeche .text{font-family:var(--font-read);font-size:38px;line-height:1.5;color:#2b2140;margin:0}
#buch .mittel .text{font-size:32px}
#buch .lang .text{font-size:27px}
#buch .lang .bildflaeche{flex-basis:0;flex-grow:.7}
#buch .lizenz .text{font-size:20px;line-height:1.4}
#buch .klein{font-size:16px;color:#75688a;word-break:break-all}
#buch .nr{position:absolute;bottom:16px;font-family:var(--font-read);font-size:20px;color:#a89c8a}
#buch .links .nr{left:30px} #buch .rechts .nr{right:30px}
#buch .ecke{position:absolute;top:0;bottom:0;width:84px;padding:0;border:0;background:transparent;cursor:pointer;z-index:2}
#buch .ecke.rechts{right:0} #buch .ecke.links{left:0}
#buch .ecke::after{content:"";position:absolute;bottom:0;width:78px;height:78px;box-shadow:0 0 8px rgba(0,0,0,.12)}
#buch .ecke.rechts::after{right:0;border-radius:0 0 16px 0;background:linear-gradient(315deg,transparent 50%,#efe5d2 50%,#fffaf0)}
#buch .ecke.links::after{left:0;border-radius:0 0 0 16px;background:linear-gradient(45deg,transparent 50%,#efe5d2 50%,#fffaf0)}
#buch .dreht-vor .blatt.rechts{animation:blattVor .5s ease-out;transform-origin:left center}
#buch .dreht-zurueck .blatt.links{animation:blattZurueck .5s ease-out;transform-origin:right center}
@keyframes blattVor{from{transform:perspective(1800px) rotateY(-80deg);opacity:.35}to{transform:none;opacity:1}}
@keyframes blattZurueck{from{transform:perspective(1800px) rotateY(80deg);opacity:.35}to{transform:none;opacity:1}}
#buch .einzeln.dreht-vor .blatt{animation:blattVor .5s ease-out;transform-origin:left center}
#buch .einzeln.dreht-zurueck .blatt{animation:blattZurueck .5s ease-out;transform-origin:right center}
#buch .einzeln .nr{right:30px;left:auto}
#buch .buchseite{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:8px 24px}
#buch .buchseite .bild{font-size:96px;line-height:1.1}
#buch .buchseite .text{font-family:var(--font-read);font-size:40px;line-height:1.5;color:#2b2140;max-width:1100px;margin:0}
#buch .buchseite.lizenz .text{font-size:24px;line-height:1.4}
#buch .buchtitel{font-size:34px;font-weight:600;margin:0;color:#8e5bd6}
#buch .kapitel{font-size:26px;margin:0;color:#75688a}
#buch .wort{cursor:pointer;border-radius:8px;padding:0 2px}
#buch .wort:active{background:#ffe066}
#buch #buchA{display:flex;flex-direction:column}
/* Spiele zwischendurch (spiele.js, Ticket 13) */
#spiele{position:fixed;z-index:6;inset:16px;display:flex}
#spiele .wk{flex:1;display:flex;flex-direction:column;gap:12px;overflow-y:auto;padding:16px;border-radius:var(--r);background:#fffaf2;box-shadow:var(--shadow);position:relative}
#spiele .bub{font-size:26px;align-self:stretch;margin:0;margin-top:auto;background:#f6efff;border:3px solid #c6a4ef}
#spS{display:flex;flex-direction:column;flex:1;min-height:0;gap:12px}
#spiele h2{margin:0 0 8px;font-weight:600;font-size:36px;color:#3b2b52;text-align:center}
#spiele .spielwahl{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;padding:8px}
#spiele .spielkarte{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px;border:0;border-radius:22px;background:#fff;box-shadow:0 6px 18px rgba(70,50,140,.18);cursor:pointer;font-family:var(--font-ui);font-size:30px;color:#3b2b52}
#spiele .spielkarte svg{width:100%;max-width:320px;height:auto}
.labyrinth{flex:1;min-height:0;display:flex}
.labyrinth svg{width:100%;height:100%;touch-action:none}
.labyrinth .tipp{animation:pulsen 1s ease-in-out infinite}
@keyframes pulsen{50%{opacity:.35}}
.wortblume{flex:1;display:flex;flex-direction:column;align-items:center;gap:18px}
.wb-oben{display:flex;align-items:center;gap:40px}
.wb-bild{font-size:150px;line-height:1}
.wb-blume svg{width:240px;height:170px}
.wb-wort{display:flex;gap:12px}
.wb-wort .lucke{display:inline-flex;align-items:flex-end;justify-content:center;min-width:64px;height:84px;border-bottom:6px solid #8e5bd6;font-family:var(--font-read);font-size:64px;color:#2b2140}
.wb-tasten{display:grid;grid-template-columns:repeat(10,minmax(56px,76px));gap:10px}
.wb-tasten .taste{min-height:64px;border:0;border-radius:14px;background:#fff;box-shadow:0 3px 8px rgba(70,50,140,.18);font-family:var(--font-read);font-size:32px;color:#3b2b52;cursor:pointer}
.wb-tasten .taste:disabled{opacity:.3;cursor:default}
.wb-tasten .taste.drin:disabled{opacity:1;background:#c6f0d0}
.aquarium{flex:1;min-height:0;display:flex;border-radius:18px;overflow:hidden}
.aquarium svg{width:100%;height:100%;touch-action:none;cursor:pointer}
.aquarium{position:relative}
.aq-panel{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;padding:84px 18px 18px;background:rgba(255,250,240,.96);overflow:auto}
.aq-panel[hidden]{display:none}
.aq-waren{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.aq-ware{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px;border:0;border-radius:18px;background:#fff;box-shadow:0 4px 12px rgba(70,50,140,.16);font-family:var(--font-ui);font-size:24px;color:#3b2b52;cursor:pointer;min-height:48px}
.aq-ware svg{width:110px;height:110px;background:#cfeefc;border-radius:14px}
.aq-ware .preis{font-size:22px;color:#8e5bd6}
.aq-ware.blass{opacity:.45}
.aq-name{display:flex;flex-direction:column;align-items:center;gap:24px}
.aq-name .name-text{min-width:320px;min-height:84px;border-bottom:6px solid #8e5bd6;font-family:var(--font-read);font-size:64px;color:#2b2140;text-align:center}
#spiele .btn.an{background:#f2c94c;color:#3b2b52}
.memory{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--spalten),1fr);gap:10px;align-content:center;max-width:min(1800px,calc((100vh - 250px) * var(--spalten) / var(--zeilen)));margin:0 auto;width:100%}
.memory.zu2{max-width:min(1800px,calc((100vh - 330px) * var(--spalten) / var(--zeilen)))}
.mem-wahl{display:flex;flex-direction:column;gap:22px;align-items:center;margin:auto}
.mem-reihe{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center}
.mem-reihe .ui{min-width:150px;font-size:28px;color:#3b2b52}
.mem-leiste{display:flex;justify-content:center;gap:24px;padding:4px 0 10px}
.mem-spieler{display:flex;align-items:center;gap:12px;padding:8px 20px;border-radius:999px;background:#fff;border:4px solid transparent;font-family:var(--font-ui);font-size:28px;color:#3b2b52}
.mem-spieler.dran{border-color:#f2c94c;box-shadow:0 0 0 6px rgba(242,201,76,.3)}
.mem-spieler .stapel{display:flex}
.mem-spieler .stapel i{width:18px;height:26px;margin-left:-8px;border-radius:4px;background:#8e5bd6;border:2px solid #fff}
.mem-karte{position:relative;aspect-ratio:1;min-height:48px;border:0;padding:0;border-radius:14px;background:none;cursor:pointer;perspective:600px}
.mem-karte .vorne,.mem-karte .hinten{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:14px;backface-visibility:hidden;transition:transform .35s}
.mem-karte .vorne{background:#fff;box-shadow:0 3px 10px rgba(70,50,140,.18);font-size:clamp(34px,5vw,64px);transform:rotateY(180deg)}
.mem-karte.wort .vorne{font-family:var(--font-read);font-size:clamp(20px,2.3vw,34px);color:#2b2140}
.mem-karte .hinten svg{width:100%;height:100%}
.mem-karte.auf .vorne{transform:rotateY(0)}
.mem-karte.auf .hinten{transform:rotateY(180deg)}
.mem-karte.gefunden .vorne{background:#c6f0d0}
.wb-wort.lang{gap:6px}
.wb-wort.lang .lucke{min-width:44px;height:70px;font-size:48px;border-bottom-width:5px}
#spiele .laden,#spiele .aufgabe-fuss{gap:20px}
#spiele .aufgabe-fuss .btn{font-family:var(--font-ui);font-size:24px;padding:12px 28px;border-radius:14px;border:0;background:#8e5bd6;color:#fff;cursor:pointer;min-height:60px}
#spiele .aufgabe-fuss .btn.ghost{background:#fff;color:#8e5bd6;border:2px solid #c6a4ef}
@media (orientation:portrait){ .wb-tasten{grid-template-columns:repeat(6,minmax(64px,1fr))} .wb-oben{gap:20px} }

/* Küche (Ticket 22): Rezeptkarten, Kochstelle, Gäste, Hildes Laden */
#kochen,#pflege,#kiste,#beet,#malen,#puppenhaus,#markt,#abenteuer{position:fixed;z-index:6;inset:16px;display:flex}
#kochen .wk,#pflege .wk,#kiste .wk,#beet .wk,#malen .wk,#puppenhaus .wk,#markt .wk,#abenteuer .wk{flex:1;display:flex;flex-direction:column;gap:12px;overflow-y:auto;padding:16px;border-radius:var(--r);background:#fff8ee;box-shadow:var(--shadow);position:relative}
#kochen .aus,#pflege .aus,#kiste .aus,#beet .aus,#malen .aus,#puppenhaus .aus,#markt .aus,#abenteuer .aus{position:absolute;top:12px;right:12px;z-index:2}
#kochen .bub,#pflege .bub,#kiste .bub,#beet .bub,#malen .bub,#puppenhaus .bub,#markt .bub,#abenteuer .bub{font-size:26px;align-self:stretch;margin:0;margin-top:auto;background:#f6efff;border:3px solid #c6a4ef}
#koS,#pfS,#kiS,#beS{display:flex;flex-direction:column;flex:1;min-height:0;gap:12px}
#kochen h2,#kiste h2,#beet h2,#malen h2,#puppenhaus h2,#markt h2,#abenteuer h2{margin:0 0 8px;font-weight:600;font-size:36px;color:#3b2b52;text-align:center}
#kochen .rezepte,#kochen .regalwaren,#kochen .gaeste,#kiste .regalwaren,#markt .regalwaren{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;padding:8px}
#kochen .regalwaren,#kiste .regalwaren{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
#kochen .rezept,#kochen .ware,#kochen .gast,#kiste .ware,#markt .ware{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px;border:0;border-radius:22px;background:#fff;box-shadow:0 6px 18px rgba(70,50,140,.18);cursor:pointer;font-family:var(--font-ui);color:#3b2b52;min-height:60px}
